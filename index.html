<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ لمنمن ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- الخلفية -->
    <div id="background"></div>

    <!-- القلوب -->
    <div id="hearts"></div>

    <!-- النجوم -->
    <div id="stars"></div>

    <!-- المحتوى -->
    <div class="container">

        <h1 id="text">
            🌸 صباح الجمال على أحلى منمن في الكوكب ده 🌸
        </h1>

        <div style="margin:15px 0;font-size:18px;color:#ff4d94;">
            احلي منمن دي ولا ايععع ❤️
        </div>

        <div id="buttons">
            <button id="nextBtn">
                💖 اضغطي هنا 💖
            </button>
        </div>

    </div>

    <!-- الأصوات -->
    <audio id="clickSound" src="sounds/click.mp3"></audio>
    <audio id="music" src="sounds/music.mp3" loop></audio>
    <audio id="kissSound" src="sounds/kiss.mp3"></audio>
    <audio id="heartSound" src="sounds/heart.mp3"></audio>

    <!-- القلب الأبيض -->
    <div id="menuBtn">🤍</div>

    <!-- القائمة السرية -->
    <div id="secretMenu">
        <button id="giftMenuBtn">
         وعدي ليكي
        </button>
    </div>

    <!-- الجافاسكريبت (لازم يكون آخر الصفحة) -->
    <script src="script.js"></script>

</body>

</html>
